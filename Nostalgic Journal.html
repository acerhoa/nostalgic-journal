<!DOCTYPE html>
<html lang="en" data-theme="cream">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nostalgic Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;600;700&family=Quicksand:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="journal.css" />
</head>
<body>
  <div class="viewport">
    <div class="scene" id="scene">

      <!-- bookmark tab -->
      <div class="tab">My Journal</div>

      <!-- THE JOURNAL (fixed centre) -->
      <div class="journal" id="journal">
        <div class="page left-page" data-screen-label="Left page">
          <div class="date" id="leftDate"></div>
          <div class="write-wrap">
            <textarea class="sheet" id="leftText" placeholder="Write your thoughts…" spellcheck="false"></textarea>
          </div>
        </div>
        <div class="page right-page" data-screen-label="Right page">
          <div class="date" id="rightDate"></div>
          <div class="write-wrap">
            <textarea class="sheet" id="rightText" placeholder="Continue writing…" spellcheck="false"></textarea>
          </div>
        </div>

        <!-- flipping leaf -->
        <div class="flip-leaf" id="leaf">
          <div class="face front page" id="leafFront"></div>
          <div class="face back page" id="leafBack"></div>
          <div class="shade"></div>
        </div>
      </div>

      <!-- CONTROLS (outside the corners) -->
      <button class="btn square" id="btn-cal"  aria-label="Calendar"></button>
      <button class="btn square" id="btn-set"  aria-label="Settings"></button>
      <button class="btn square" id="btn-calc" aria-label="Calculator"></button>
      <button class="btn round"  id="btn-prev" aria-label="Previous page"></button>
      <button class="btn round"  id="btn-next" aria-label="Next page"></button>

      <!-- PANELS (slide from under the journal) -->
      <div class="panel left" id="panel-cal">
        <div id="cal-body"></div>
      </div>

      <div class="panel left" id="panel-set">
        <h3>Settings</h3>
        <div class="set-group">
          <div class="set-label">Color theme</div>
          <div class="swatches" id="set-swatches"></div>
        </div>
        <div class="set-group">
          <div class="set-label">Text size</div>
          <div class="seg" id="set-size">
            <button data-size="s">Small</button>
            <button data-size="m">Medium</button>
            <button data-size="l">Large</button>
          </div>
        </div>
        <div class="set-group">
          <div class="set-label">Font</div>
          <div class="font-list" id="set-fonts"></div>
        </div>
      </div>

      <div class="panel right" id="panel-calc">
        <h3>Calculator</h3>
        <div class="calc-display">
          <div class="calc-expr" id="calc-expr"></div>
          <div class="calc-val" id="calc-val">0</div>
        </div>
        <div class="calc-keys" id="calc-keys"></div>
        <div class="calc-hist" id="calc-hist"></div>
      </div>

    </div>
  </div>
  <script src="journal.js"></script>
</body>
</html>
